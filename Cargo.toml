[package]
name = "tokenbuddy"
description = "TokenBuddy — local-first token usage, session analytics and full-text context search for AI coding agents"
license = "MIT"
repository = "https://github.com/walker83/TokenBuddy"
version = "0.5.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "tokenbuddy"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
rusqlite = { version = "0.31" }
arrow = "58"
parquet = { version = "58", features = ["zstd"] }
anyhow = ">=1.0.103"
tiny_http = "0.12"
zstd = "0.13"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
# Fleet at-rest encryption (opt-in `encrypt = true`): XChaCha20-Poly1305
# from RustCrypto — pure Rust, widely reviewed, no C toolchain. hkdf derives
# the content key from the existing S3 secret_key, so users add no new
# secret to manage.
chacha20poly1305 = "0.10"
hkdf = "0.12"
libc = "0.2"
# Fleet sync talks to a LAN S3 endpoint (RustFS) in plain HTTP; the TLS
# feature is deliberately off to keep the binary small.
ureq = { version = "2", default-features = false }

[build-dependencies]
zstd = "0.13"

[lib]
name = "tokenbuddy"
path = "src/lib.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
